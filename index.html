<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Morgan AI Quant Engine</title>
<style>
:root{--bg:#f4f2ec;--pn:#fff;--ink:#181826;--mu:#8a8a96;--ln:#e4e1d8;--rd:#e5484d;--gr:#18a058;--pu:#7c5cff;--te:#0fa3a3;--am:#e8a13c;--m:'JetBrains Mono',Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font:10px var(--m);overflow:hidden}
#app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) 27dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
header{display:flex;align-items:center;gap:6px;background:var(--pn);border-bottom:1px solid var(--ln);padding:5px 7px}
.lg{font-weight:800;font-size:11px;white-space:nowrap}.lg b{color:var(--pu)}
.st{display:flex;flex:1;justify-content:space-between;gap:4px}
.st div{line-height:1.15;text-align:center}.st i{display:block;font-style:normal;font-size:7px;color:var(--mu)}.st span{font-weight:700;font-size:10.5px}
.b{border:1px solid var(--ln);background:var(--pn);border-radius:4px;padding:4px 7px;font-weight:700;font-size:9px}
.b.go{background:var(--gr);color:#fff;border-color:var(--gr)}.b.dk{background:var(--ink);color:#fff}
.up{color:var(--gr)}.dn{color:var(--rd)}
#sb{position:relative;display:flex;gap:5px;align-items:center;padding:4px 7px;background:var(--pn);border-bottom:1px solid var(--ln)}
#q{flex:0 0 38%;border:1px solid var(--ln);border-radius:4px;padding:4px 6px;background:var(--bg)}
#wl{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.ch{white-space:nowrap;border:1px solid var(--ln);border-radius:10px;padding:3px 7px;background:var(--pn);font-size:9px}
.ch.on{background:var(--ink);color:#fff}.ch s{text-decoration:none;margin-left:4px;opacity:.5}
#res{position:absolute;left:7px;top:100%;width:62%;max-height:40dvh;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:4px;z-index:20;display:none;box-shadow:0 6px 18px #0002}
#res div{padding:7px 9px;border-bottom:1px solid var(--ln)}
main{display:grid;grid-template-rows:1fr 1fr;min-height:0}
.cv{position:relative;min-height:0;border-bottom:1px solid var(--ln)}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;left:6px;top:4px;font-size:9px;pointer-events:none;line-height:1.35}
.tf{position:absolute;right:5px;top:3px;display:flex;gap:3px}.tf button{padding:2px 6px;font-size:8px}
#dec{position:absolute;right:7px;bottom:5px;text-align:right;font-weight:800;font-size:13px;pointer-events:none}
#dec small{display:block;font-size:8px;font-weight:400;color:var(--mu)}
#feat{position:absolute;left:6px;bottom:4px;font-size:7.5px;color:var(--mu);pointer-events:none;line-height:1.4}
footer{display:flex;flex-direction:column;min-height:0;background:var(--pn);border-top:1px solid var(--ln)}
#tabs{display:flex;border-bottom:1px solid var(--ln)}#tabs button{flex:1;border:0;background:none;padding:5px;font-weight:700;color:var(--mu)}#tabs .on{color:var(--ink);box-shadow:inset 0 -2px var(--pu)}
#lst{flex:1;overflow:auto;padding:2px 7px}
.r{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--ln);gap:6px}
.r .x{border:1px solid var(--ln);background:var(--bg);border-radius:3px;padding:2px 6px;font-size:8px}
.tg{font-size:8px;padding:1px 4px;border-radius:3px;font-weight:700}.tg.B{background:#e9f9f0;color:var(--gr)}.tg.S{background:#fdecec;color:var(--rd)}
.sh{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:40}
.sh>div{background:var(--pn);width:100%;max-height:85dvh;overflow:auto;border-radius:12px 12px 0 0;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh label{display:flex;flex-direction:column;gap:2px;color:var(--mu);font-size:8px}
.sh input,.sh select{border:1px solid var(--ln);border-radius:4px;padding:6px;font-size:11px;background:var(--bg);color:var(--ink)}
.sh .w{grid-column:1/3}
</style></head><body>
<div id="app">
<header><div class="lg">MORGAN <b>AI</b></div>
<div class="st"><div><i>BALANCE</i><span id="bal">—</span></div><div><i>EQUITY</i><span id="eq">—</span></div><div><i>DAY P&amp;L</i><span id="dp">—</span></div><div><i>DRAWDOWN</i><span id="dd">—</span></div></div>
<button class="b" id="bs">⚙</button><button class="b dk" id="bc">LOGIN</button><button class="b" id="br">START</button></header>
<div id="sb"><input id="q" placeholder="Search any pair…" autocomplete="off"><div id="wl"></div><div id="res"></div></div>
<main>
<div class="cv"><canvas id="ch"></canvas><div class="ov" id="ct"></div><div class="tf"><button class="b" data-t="1">M1</button><button class="b" data-t="5">M5</button><button class="b" data-t="15">M15</button></div></div>
<div class="cv"><canvas id="orb"></canvas><div id="feat"></div><div id="dec"></div></div>
</main>
<footer><div id="tabs"><button class="on" data-k="p">POSITIONS</button><button data-k="h">HISTORY</button><button data-k="l">LOG</button></div><div id="lst"></div></footer>
</div>
<div class="sh" id="lg"><div>
<label class="w">Environment<select id="env"><option>demo</option><option>live</option></select></label>
<label class="w">Client ID<input id="cid"></label><label class="w">Client Secret<input id="sec" type="password"></label><label class="w">Access Token<input id="tok" type="password"></label>
<label class="w"><span><input type="checkbox" id="rem" checked> Remember on this phone</span></label>
<button class="b go w" id="go">CONNECT</button></div></div>
<div class="sh" id="st"><div>
<label>Lot size<input id="lot" type="number" step="0.01"></label><label>Min confidence %<input id="mc" type="number"></label>
<label>SL × ATR<input id="sl" type="number" step="0.1"></label><label>TP × SL (R:R)<input id="rr" type="number" step="0.1"></label>
<label>Profit-protect ARM $ (0=off)<input id="arm" type="number" step="0.1"></label><label>Giveback $<input id="gb" type="number" step="0.05"></label>
<label>Max open trades<input id="mx" type="number"></label><label>Cooldown sec per pair<input id="cd" type="number"></label>
<button class="b go w" id="sv">SAVE</button></div></div>
<script>
const $=i=>document.getElementById(i),PT={AA:2100,AAR:2101,XA:2102,XAR:2103,NO:2106,CP:2111,SL:2114,SLR:2115,SB:2116,SBR:2117,TR:2121,TRR:2122,RC:2124,RCR:2125,EX:2126,SS:2127,SP:2131,OE:2132,ER:2142,GA:2149,GAR:2150,TB:2137,TBR:2138,HB:51};
const D={lot:0.01,mc:70,sl:1.5,rr:1.5,arm:0,gb:0.2,mx:3,cd:120};
let S={cfg:Object.assign({},D),cr:{env:'demo'},ws:null,acct:0,bal:0,md:2,syms:[],wl:{},sel:0,pos:[],hist:[],logs:[],peak:{},pend:{},cl:{},ok:false,run:false,tf:1,tab:'p',n:0,rt:0,eqPk:0,day:null};
const load=()=>{try{const j=JSON.parse(localStorage.morgan||'{}');Object.assign(S.cfg,j.cfg);S.cr=j.cr||S.cr;S.names=j.names||[];S.day=j.day||null;S.eqPk=j.pk||0}catch(e){S.names=[]}};load();
const save=()=>{try{localStorage.morgan=JSON.stringify({cfg:S.cfg,cr:S.cr.rem?S.cr:{env:S.cr.env},names:Object.values(S.wl).map(s=>s.name),day:S.day,pk:S.eqPk})}catch(e){}};
const log=m=>{S.logs.unshift(new Date().toLocaleTimeString().slice(0,8)+' '+m);S.logs.length=Math.min(S.logs.length,60);if(S.tab=='l')ui()};
const send=(pt,pl)=>{if(S.ws&&S.ws.readyState==1)S.ws.send(JSON.stringify({clientMsgId:'m'+(S.n++),payloadType:pt,payload:pl}))};
/* ---------- connection with auto-recovery ---------- */
function conn(){
  clearTimeout(S.rt);if(S.ws){S.ws.onclose=null;try{S.ws.close()}catch(e){}}
  const c=S.cr;if(!c.cid||!c.sec||!c.tok){$('lg').style.display='flex';return}
  const ws=S.ws=new WebSocket(c.env=='live'?'wss://live.ctraderapi.com:5036':'wss://demo.ctraderapi.com:5036');S.ok=false;
  ws.onopen=()=>{S.try=0;log('Connected — authorizing');send(PT.AA,{clientId:c.cid,clientSecret:c.sec})};
  ws.onmessage=e=>{try{H(JSON.parse(e.data))}catch(x){log('msg error '+x.message)}};
  ws.onclose=()=>{if(S.ws!==ws)return;S.ok=false;const d=Math.min(30000,1000*2**(S.try=(S.try||0)+1));log('Connection lost — retry in '+d/1000+'s (no trades until re-synced)');S.rt=setTimeout(conn,d)};
  ws.onerror=()=>{};
}
setInterval(()=>send(PT.HB,{}),10000);
function H(m){const p=m.payload||{};switch(m.payloadType){
 case PT.AAR:send(PT.GA,{accessToken:S.cr.tok});break;
 case PT.GAR:{const a=p.ctidTraderAccount||[],w=S.cr.env=='live',ac=a.find(x=>!!x.isLive==w)||a[0];if(!ac){log('No trading account on this token');return}S.acct=ac.ctidTraderAccountId;send(PT.XA,{ctidTraderAccountId:S.acct,accessToken:S.cr.tok});break}
 case PT.XAR:log('Account '+S.acct+' ready');send(PT.SL,{ctidTraderAccountId:S.acct});send(PT.TR,{ctidTraderAccountId:S.acct});send(PT.RC,{ctidTraderAccountId:S.acct});break;
 case PT.SLR:S.syms=(p.symbol||[]).map(s=>({id:s.symbolId,name:s.symbolName}));if(!Object.keys(S.wl).length){const w=(S.names&&S.names.length?S.names:['EURUSD','GBPUSD','USDJPY','XAUUSD','BTCUSD','ETHUSD']);w.forEach(n=>{const s=S.syms.find(x=>x.name.replace(/\W/g,'').toUpperCase()==n.replace(/\W/g,'').toUpperCase());if(s)addWl(s.id,1)})}else Object.values(S.wl).forEach(s=>loadSym(s.id));break;
 case PT.TRR:{const t=p.trader||{};S.md=t.moneyDigits||2;S.bal=t.balance/10**S.md;dayInit();break}
 case PT.RCR:S.pos=(p.position||[]).map(q=>({id:q.positionId,sid:q.tradeData.symbolId,side:q.tradeData.tradeSide==1?'B':'S',vol:q.tradeData.volume,px:q.price,sl:q.stopLoss,tp:q.takeProfit,lb:q.tradeData.label}));S.ok=true;S.pend={};log('Synced with broker: '+S.pos.length+' open — trading allowed');break;
 case PT.SBR:{const f=(p.symbol||[])[0];if(!f)break;const s=S.wl[f.symbolId];if(s){Object.assign(s,{dg:f.digits,lot:Number(f.lotSize)||10000000,mn:Number(f.minVolume)||0,st:Number(f.stepVolume)||0,mxv:Number(f.maxVolume)||0});}break}
 case PT.TBR:{const s=S.wl[p.symbolId];if(!s)break;const b=(p.trendbar||[]).map(t=>{const l=t.low;return{t:t.utcTimestampInMinutes*60000,o:(l+(t.deltaOpen||0))/1e5,h:(l+(t.deltaHigh||0))/1e5,l:l/1e5,c:(l+(t.deltaClose||0))/1e5}});if(b.length){s.bars=b;log(s.name+': '+b.length+' candles loaded')}break}
 case PT.SP:{const s=S.wl[p.symbolId];if(!s)break;if(p.bid)s.bid=p.bid/1e5;if(p.ask)s.ask=p.ask/1e5;tick(s);break}
 case PT.EX:{const d=p.deal&&p.deal.closePositionDetail;if(d){const k=10**(d.moneyDigits||2),pl=((d.grossProfit||0)+(d.swap||0)+(d.commission||0))/k,s=S.wl[p.deal.symbolId];S.hist.unshift({n:s?s.name:p.deal.symbolId,side:p.deal.tradeSide==1?'B':'S',pl,t:Date.now()});S.hist.length=Math.min(S.hist.length,40);log('Closed '+(s?s.name:'')+' net '+pl.toFixed(2))}else log('Order '+(p.executionType==3||p.executionType=='ORDER_FILLED'?'filled':'event'));send(PT.RC,{ctidTraderAccountId:S.acct});send(PT.TR,{ctidTraderAccountId:S.acct});break}
 case PT.OE:case PT.ER:log('Broker: '+(p.description||p.errorCode||'error'));S.pend={};break}}
/* ---------- symbols, search, history, live bars ---------- */
function addWl(id,quiet){if(S.wl[id]||Object.keys(S.wl).length>=8)return;const x=S.syms.find(s=>s.id==id);if(!x)return;S.wl[id]={id,name:x.name,bars:[]};S.sel=S.sel||id;loadSym(id);if(!quiet){S.sel=id;save()}wlui()}
function loadSym(id){send(PT.SBR&&PT.SB,{ctidTraderAccountId:S.acct,symbolId:[id]});send(PT.SS,{ctidTraderAccountId:S.acct,symbolId:[id]});const n=Date.now();send(PT.TB,{ctidTraderAccountId:S.acct,symbolId:id,period:1,fromTimestamp:n-4*864e5,toTimestamp:n,count:700})}
function tick(s){const px=s.bid&&s.ask?(s.bid+s.ask)/2:(s.bid||s.ask),m=Math.floor(Date.now()/6e4)*6e4,b=s.bars,l=b[b.length-1];if(!px)return;s.px=px;if(l&&l.t==m){l.h=Math.max(l.h,px);l.l=Math.min(l.l,px);l.c=px}else if(b.length){b.push({t:m,o:px,h:px,l:px,c:px});if(b.length>900)b.shift()}}
function wlui(){$('wl').innerHTML=Object.values(S.wl).map(s=>`<div class="ch ${s.id==S.sel?'on':''}" data-i="${s.id}">${s.name}<s data-d="${s.id}">×</s></div>`).join('')}
$('wl').onclick=e=>{const d=e.target.dataset.d,i=e.target.closest('.ch');if(d){delete S.wl[d];if(S.sel==d)S.sel=+Object.keys(S.wl)[0]||0;save()}else if(i)S.sel=+i.dataset.i;wlui()};
$('q').oninput=e=>{const v=e.target.value.replace(/\W/g,'').toUpperCase(),r=$('res');if(!v){r.style.display='none';return}const f=S.syms.filter(s=>s.name.replace(/\W/g,'').toUpperCase().includes(v)).slice(0,30);r.innerHTML=f.length?f.map(s=>`<div data-i="${s.id}">${s.name}</div>`).join(''):'<div>Not offered by your broker</div>';r.style.display='block'};
$('res').onclick=e=>{const i=e.target.dataset.i;if(i){addWl(+i);$('res').style.display='none';$('q').value=''}};
/* ---------- Megan AI analysis (pure function of candles) ---------- */
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
function agg(b,m){if(m==1)return b;const o=[];b.forEach(x=>{const t=Math.floor(x.t/(m*6e4))*m*6e4,l=o[o.length-1];if(l&&l.t==t){l.h=Math.max(l.h,x.h);l.l=Math.min(l.l,x.l);l.c=x.c}else o.push({t,o:x.o,h:x.h,l:x.l,c:x.c})});return o}
function analyze(m1){const b=agg(m1,5);if(b.length<60)return null;const c=b.map(x=>x.c),n=b.length-1,e9=ema(c,9),e21=ema(c,21),e50=ema(c,50);
 const tr=b.map((x,i)=>i?Math.max(x.h-x.l,Math.abs(x.h-b[i-1].c),Math.abs(x.l-b[i-1].c)):x.h-x.l),at=ema(tr,14),atr=at[n],atrAvg=at.slice(-50).reduce((a,v)=>a+v,0)/50;
 let g=0,ls=0;for(let i=n-14;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:ls-=d}const rsi=ls?100-100/(1+g/ls):100;
 const sw=[];for(let i=2;i<n-2;i++){const x=b[i];if(x.h>b[i-1].h&&x.h>b[i-2].h&&x.h>b[i+1].h&&x.h>b[i+2].h)sw.push({i,k:'H',v:x.h});if(x.l<b[i-1].l&&x.l<b[i-2].l&&x.l<b[i+1].l&&x.l<b[i+2].l)sw.push({i,k:'L',v:x.l})}
 const H=sw.filter(s=>s.k=='H').slice(-2),L=sw.filter(s=>s.k=='L').slice(-2),cl=x=>Math.max(-1,Math.min(1,x));
 const trend=cl((e21[n]-e50[n])/atr*.8+(c[n]>e50[n]?.3:-.3));
 const mom=cl((rsi-50)/22*.6+(e9[n]-e21[n])/atr*.6);
 let st=0;if(H.length>1&&L.length>1)st=(H[1].v>H[0].v&&L[1].v>L[0].v)?1:(H[1].v<H[0].v&&L[1].v<L[0].v)?-1:0;
 const lh=H.length?H[H.length-1].v:null,ll=L.length?L[L.length-1].v:null,x=b[n-1],y=b[n];
 let br=0;if(lh&&x.c>lh+.1*atr)br=1;else if(ll&&x.c<ll-.1*atr)br=-1;
 let sp=0;if(lh&&y.h>lh&&y.c<lh&&y.c<y.o)sp=-1;else if(ll&&y.l<ll&&y.c>ll&&y.c>y.o)sp=1;
 let pb=0;if(trend>.25&&Math.abs(c[n]-e21[n])<.6*atr&&y.c>y.o)pb=1;else if(trend<-.25&&Math.abs(c[n]-e21[n])<.6*atr&&y.c<y.o)pb=-1;
 const vol=atr/(atrAvg||atr),vf=.65+.35*Math.min(vol,1.5)/1.5,sc=.25*trend+.2*mom+.2*st+.15*br+.1*sp+.1*pb;
 const cf=Math.min(100,Math.abs(sc)*135*vf);
 return{f:[trend,mom,st,br,sp,pb,cl(vol-1)],cf,dir:sc>0?'BUY':'SELL',atr,rsi,e21:e21[n],vol,sw}}
const FN=['trend','momentum','structure','breakout','sweep','pullback','volatility'];
/* ---------- engine loop: real orders, one trade per pair, broker-synced ---------- */
function usd(q,s,px){const u=q.vol/100;return(q.side=='B'?px-q.px:q.px-px)*u}
function floatAll(){let t=0;S.pos.forEach(q=>{const s=S.wl[q.sid];if(s&&s.bid&&s.ask)t+=usd(q,s,q.side=='B'?s.bid:s.ask)});return t}
function engine(){Object.values(S.wl).forEach(s=>{s.ai=analyze(s.bars)});if(!S.run||!S.ok)return;const c=S.cfg,now=Date.now();
 S.pos.forEach(q=>{const s=S.wl[q.sid];if(!s||!s.bid||!s.ask||S.cl[q.id]>now)return;const f=usd(q,s,q.side=='B'?s.bid:s.ask);S.peak[q.id]=Math.max(S.peak[q.id]||0,f);
  if(c.arm>0&&S.peak[q.id]>=c.arm&&f<=S.peak[q.id]-c.gb){S.cl[q.id]=now+6000;log('Profit-protect: closing '+s.name+' at '+f.toFixed(2)+' (peak '+S.peak[q.id].toFixed(2)+')');send(PT.CP,{ctidTraderAccountId:S.acct,positionId:q.id,volume:q.vol})}});
 if(S.pos.length>=c.mx||Object.keys(S.pend).length)return;
 for(const s of Object.values(S.wl)){const a=s.ai;if(!a||!s.dg&&s.dg!==0||!s.bid||!s.ask||a.cf<c.mc)continue;
  if(S.pos.some(q=>q.sid==s.id)||(s.last&&now-s.last<c.cd*1e3)||s.ask-s.bid>.3*a.atr)continue;
  const dist=a.atr*c.sl,v=vol(s);if(!v)continue;s.last=now;S.pend[s.id]=now;
  log('MEGAN '+a.dir+' '+s.name+' conf '+a.cf.toFixed(0)+'% — sending order');
  send(PT.NO,{ctidTraderAccountId:S.acct,symbolId:s.id,orderType:1,tradeSide:a.dir=='BUY'?1:2,volume:v,relativeStopLoss:Math.round(dist*1e5),relativeTakeProfit:Math.round(dist*c.rr*1e5),label:'MORGAN'});
  setTimeout(()=>{delete S.pend[s.id]},8000);break}}
function vol(s){let v=Math.round(S.cfg.lot*(s.lot||1e7));if(s.st>0)v=Math.round(v/s.st)*s.st;if(s.mn&&v<s.mn){log(s.name+': lot below broker minimum '+(s.mn/s.lot).toFixed(3));return 0}if(s.mxv&&v>s.mxv)v=s.mxv;return v}
setInterval(engine,1000);
/* ---------- UI ---------- */
const f2=(v,d=2)=>v==null||isNaN(v)?'—':v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
function dayInit(){const d=new Date().toISOString().slice(0,10);if(!S.day||S.day.d!=d){S.day={d,b:S.bal};S.eqPk=S.bal;save()}}
function ui(){const fl=floatAll(),eq=S.bal+fl;if(S.day){S.eqPk=Math.max(S.eqPk,eq);const dp=eq-S.day.b,dd=S.eqPk?(S.eqPk-eq)/S.eqPk*100:0;$('dp').textContent=f2(dp);$('dp').className=dp>=0?'up':'dn';$('dd').textContent=f2(dd)+'%'}
 $('bal').textContent=f2(S.bal);$('eq').textContent=f2(eq);$('bc').textContent=S.ok?'● LIVE':(S.ws?'SYNC…':'LOGIN');$('br').className='b'+(S.run?' go':'');$('br').textContent=S.run?'RUNNING':'START';
 const k=S.tab,L=$('lst');if(k=='p')L.innerHTML=S.pos.length?S.pos.map(q=>{const s=S.wl[q.sid],f=s&&s.bid?usd(q,s,q.side=='B'?s.bid:s.ask):0;return`<div class="r"><span><span class="tg ${q.side}">${q.side=='B'?'BUY':'SELL'}</span> ${s?s.name:q.sid} @ ${q.px}</span><span class="${f>=0?'up':'dn'}">${f2(f)}</span><button class="x" data-c="${q.id}" data-v="${q.vol}">close</button></div>`}).join(''):'<div class="r">No open positions</div>';
 else if(k=='h')L.innerHTML=S.hist.map(h=>`<div class="r"><span><span class="tg ${h.side}">${h.side}</span> ${h.n}</span><span class="${h.pl>=0?'up':'dn'}">${f2(h.pl)}</span></div>`).join('')||'<div class="r">No closed trades yet</div>';
 else L.innerHTML=S.logs.map(x=>`<div class="r">${x}</div>`).join('');
 const s=S.wl[S.sel];if(s){const a=s.ai;$('ct').innerHTML=`<b>${s.name}</b> ${s.px?s.px.toFixed(s.dg||5):'…'} <span class="mu">spr ${s.bid&&s.ask?((s.ask-s.bid)/(a?a.atr:1)*100).toFixed(0)+'% ATR':'—'}</span>`;
  $('dec').innerHTML=a?`<span class="${a.cf>=S.cfg.mc?(a.dir=='BUY'?'up':'dn'):''}">${a.cf>=S.cfg.mc?a.dir:'WAIT'}</span><small>${a.cf.toFixed(0)}% · RSI ${a.rsi.toFixed(0)}</small>`:'<small>collecting candles…</small>';
  $('feat').innerHTML=a?FN.map((n,i)=>n.slice(0,4)+' '+(a.f[i]>=0?'+':'')+a.f[i].toFixed(2)).join(' · '):''}}
setInterval(ui,500);

$('bc').onclick=()=>{$('env').value=S.cr.env||'demo';$('cid').value=S.cr.cid||'';$('sec').value=S.cr.sec||'';$('tok').value=S.cr.tok||'';$('lg').style.display='flex'};

/* ---------- canvas: candles ---------- */
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!=r.width*d){c.width=r.width*d;c.height=r.height*d}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,r.width,r.height]}
function chart(){const[x,w,h]=fit($('ch')),s=S.wl[S.sel];x.clearRect(0,0,w,h);if(!s||s.bars.length<5){x.fillStyle='#8a8a96';x.fillText(S.ok?'Loading candles…':'Login, then pick a pair',10,h/2);return}
 const b=agg(s.bars,S.tf).slice(-48),mx=Math.max(...b.map(q=>q.h)),mn=Math.min(...b.map(q=>q.l)),pad=(mx-mn)*.08||1e-5,Y=v=>h-14-(v-mn+pad)/(mx-mn+2*pad)*(h-34),st=(w-48)/b.length;
 b.forEach((q,i)=>{const X=8+i*st,u=q.c>=q.o;x.strokeStyle=x.fillStyle=u?'#18a058':'#e5484d';x.beginPath();x.moveTo(X+st/2,Y(q.h));x.lineTo(X+st/2,Y(q.l));x.stroke();x.fillRect(X+1,Math.min(Y(q.o),Y(q.c)),st-2,Math.max(1,Math.abs(Y(q.o)-Y(q.c))))});
 const c=b.map(q=>q.c),e=ema(agg(s.bars,S.tf).map(q=>q.c),21).slice(-48);x.strokeStyle='#7c5cff';x.lineWidth=1.2;x.beginPath();e.forEach((v,i)=>i?x.lineTo(8+i*st+st/2,Y(v)):x.moveTo(8+st/2,Y(v)));x.stroke();x.lineWidth=1;
 S.pos.filter(q=>q.sid==s.id).forEach(q=>{x.strokeStyle=q.side=='B'?'#18a058':'#e5484d';x.setLineDash([4,3]);x.beginPath();x.moveTo(0,Y(q.px));x.lineTo(w-40,Y(q.px));x.stroke();x.setLineDash([]);x.fillStyle=x.strokeStyle;x.fillText(q.side=='B'?'BUY':'SELL',w-38,Y(q.px)+3)});
 const px=c[c.length-1];x.fillStyle='#181826';x.fillRect(w-44,Y(px)-6,44,12);x.fillStyle='#fff';x.fillText(px.toFixed(s.dg||5),w-43,Y(px)+3)}
/* ---------- canvas: Megan's brain (live veins from her real analysis) ---------- */
function orb(t){const[x,w,h]=fit($('orb')),s=S.wl[S.sel],a=s&&s.ai,F=a?a.f:[0,0,0,0,0,0,0],cx=w/2,cy=h/2,R=Math.min(w*.17,h*.28),conf=a?a.cf/100:.1;x.clearRect(0,0,w,h);
 const inn=F.map((v,i)=>({x:w*.1,y:h*.12+i*(h*.76)/6,v})),out=[['BUY',1],['WAIT',0],['SELL',-1]].map((o,i)=>({x:w*.9,y:h*.28+i*h*.22,n:o[0],d:o[1]})),dr=a?(a.cf>=S.cfg.mc?(a.dir=='BUY'?1:-1):0):0;
 const vein=(x0,y0,x1,y1,col,al,wd,ph,k)=>{x.strokeStyle=col;x.globalAlpha=al;x.lineWidth=wd;const sw=Math.sin(t/700+ph)*h*.05,mx=(x0+x1)/2;x.beginPath();x.moveTo(x0,y0);x.bezierCurveTo(mx,y0+sw,mx,y1-sw,x1,y1);x.stroke();
  for(let j=0;j<2;j++){const u=((t/(1400-conf*700)+ph*.3+j*.5)%1),v=1-u,px=v*v*v*x0+3*v*v*u*mx+3*v*u*u*mx+u*u*u*x1,py=v*v*v*y0+3*v*v*u*(y0+sw)+3*v*u*u*(y1-sw)+u*u*u*y1;x.fillStyle=col;x.globalAlpha=Math.min(1,al*3);x.beginPath();x.arc(px,py,1.6,0,6.3);x.fill()}x.globalAlpha=1};
 inn.forEach((n,i)=>{const col=i==6?'#e8a13c':n.v>=0?'#18a058':'#e5484d',m=Math.abs(n.v);for(let k=0;k<4;k++){const an=(k-1.5)*.5+i*.3;vein(n.x,n.y,cx-R*Math.cos(an)*.9,cy+R*Math.sin(an),col,.12+m*.5,.5+m*1.8,i+k,k)}x.fillStyle=col;x.beginPath();x.arc(n.x,n.y,3+m*3,0,6.3);x.fill();x.fillStyle='#8a8a96';x.fillText(FN[i].slice(0,5),n.x+9,n.y+3)});
 out.forEach(o=>{const on=o.d==dr,col=o.d>0?'#18a058':o.d<0?'#e5484d':'#7c5cff';for(let k=0;k<3;k++)vein(cx+R*.9,cy+(k-1)*R*.4,o.x,o.y,col,on?.55:.1,on?2:.6,o.d+k,k);x.fillStyle=col;x.globalAlpha=on?1:.4;x.beginPath();x.arc(o.x,o.y,on?8:4,0,6.3);x.fill();x.globalAlpha=1;x.fillStyle='#181826';x.fillText(o.n,o.x-12,o.y-12)});
 for(let i=0;i<46;i++){const an=i/46*6.283+t/4000,r=R*(.8+.25*Math.sin(t/500+i*2.3)*conf);x.strokeStyle=`hsla(${250+i*3+(F[0]>0?-60:0)},75%,55%,${.15+conf*.3})`;x.lineWidth=.8;x.beginPath();x.moveTo(cx+Math.cos(an)*r*.35,cy+Math.sin(an)*r*.35);x.quadraticCurveTo(cx+Math.cos(an+1.3)*r*1.1,cy+Math.sin(an+1.3)*r*1.1,cx+Math.cos(an+2.6)*r,cy+Math.sin(an+2.6)*r);x.stroke()}
 const g=x.createRadialGradient(cx,cy,2,cx,cy,R*(.7+conf*.2));g.addColorStop(0,'#fff');g.addColorStop(.35,'#7c5cffcc');g.addColorStop(1,'#0fa3a300');x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*(.7+conf*.2),0,6.3);x.fill()}
(function fr(t){chart();orb(t);requestAnimationFrame(fr)})(0);
