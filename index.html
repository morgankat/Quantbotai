  else if(t===2126){setTimeout(()=>send(2124,{ctidTraderAccountId:S.acct}),800);setTimeout(()=>send(2121,{ctidTraderAccountId:S.acct}),1500)}

  else if(t===2115){S.syms=(p.symbol||[]).filter(s=>s.symbolName);const d=S.syms.find(s=>/^XAUUSD/.test(s.symbolName))||S.syms[0];if(d)choose(d)}
  else if(t===2117){const s=(p.symbol||[])[0];if(s&&S.cur&&s.symbolId===S.cur.symbolId){S.digits=s.digits||5;S.cur.full=s}}
  else if(t===2138)bars(p);
  else if(t===2131&&S.cur&&p.symbolId===S.cur.symbolId)tick(p);
  else if(t===2142||t===50){if(p.description||p.errorCode)say((p.errorCode||'Error')+': '+(p.description||''))}
}
function getBars(){const id=S.cur.symbolId,now=Date.now();send(2137,{ctidTraderAccountId:S.acct,symbolId:id,period:S.tf,fromTimestamp:now-320*TFM[S.tf]*6e4,toTimestamp:now})}
function choose(s){S.cur=s;S.bars=[];S.bid=S.ask=0;S.an=null;V.off=0;const a=S.acct,id=s.symbolId;
  send(2116,{ctidTraderAccountId:a,symbolId:[id]});send(2127,{ctidTraderAccountId:a,symbolId:[id]});getBars();head()}
function bars(p){const k=1e5;S.bars=(p.trendbar||[]).map(b=>({t:b.utcTimestampInMinutes,o:(b.low+b.deltaOpen)/k,c:(b.low+b.deltaClose)/k,h:(b.low+b.deltaHigh)/k,l:b.low/k})).sort((a,b)=>a.t-b.t);analyze()}
function tick(p){const k=1e5;if(p.bid)S.bid=p.bid/k;if(p.ask)S.ask=p.ask/k;const px=S.bid||S.ask;if(!px||!S.bars.length)return;
  const m=Math.floor(Date.now()/60000),bt=m-m%TFM[S.tf],L=S.bars[S.bars.length-1];
  if(bt>L.t)S.bars.push({t:bt,o:px,h:px,l:px,c:px});else{L.c=px;L.h=Math.max(L.h,px);L.l=Math.min(L.l,px)}
  const n=Date.now();if(!S.la||n-S.la>1500){S.la=n;analyze()}monitor()}
// ---------- search ----------
$('q').oninput=()=>{const v=$('q').value.trim().toUpperCase(),l=$('list');if(!v){l.style.display='none';return}
  const r=S.syms.filter(s=>s.symbolName.toUpperCase().includes(v)).slice(0,12);
  l.innerHTML=r.length?'':'<div>Not offered by this broker.</div>';r.forEach(s=>{const d=document.createElement('div');d.textContent=s.symbolName;d.onclick=()=>{choose(s);l.style.display='none';$('q').value=''};l.appendChild(d)});l.style.display='block'};
// ---------- analysis engine (all numbers come from the live candles) ----------
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
const cl=(v,a=-1,b=1)=>Math.max(a,Math.min(b,v));
function analyze(){const B=S.bars;if(B.length<40)return;const c=B.map(x=>x.c),n=c.length-1,e12=ema(c,12),e26=ema(c,26);
  let g=0,ls=0;for(let i=n-13;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:ls-=d}const rsi=ls?100-100/(1+g/ls):100;
  const trf=(a)=>a.map((x,i,r)=>i?Math.max(x.h-x.l,Math.abs(x.h-r[i-1].c),Math.abs(x.l-r[i-1].c)):x.h-x.l).slice(1),avg=a=>a.reduce((p,q)=>p+q,0)/a.length;
  const atr=avg(trf(B.slice(-15)))||1e-9,atr0=avg(trf(B.slice(-60,-15)))||atr;
  const w=B.slice(-22,-2),hi=Math.max(...w.map(x=>x.h)),lo=Math.min(...w.map(x=>x.l)),L=B[n],px=c[n],P=B[n-1];
  const trend=cl((e12[n]-e26[n])/atr/1.5),mom=cl((px-c[n-6])/atr/3),rs=cl((rsi-50)/25),vol=cl(atr/atr0-1);
  const up=px>hi,dn=px<lo,swU=L.h>hi&&L.c<hi,swD=L.l<lo&&L.c>lo,struct=swD?1:swU?-1:up?.8:dn?-.8:0;
  const pb=trend>.15&&Math.abs(px-e12[n])<atr*.6&&rsi<58?1:trend<-.15&&Math.abs(px-e12[n])<atr*.6&&rsi>42?-1:0;
  const bd=Math.abs(P.c-P.o),body=bd>.6*(P.h-P.l||1e-9)&&bd>atr*.9?(P.c>P.o?1:-1):0;
  let fz=null;for(let i=n-1;i>=n-14&&i>=2;i--){const a1=B[i-2],c1=B[i];if(a1.h<c1.l){fz=[a1.h,c1.l,1];break}if(a1.l>c1.h){fz=[c1.h,a1.l,-1];break}}
  const fvg=fz?(px>=fz[0]&&px<=fz[1]?fz[2]:fz[2]*.4):0;
  const score=cl(trend*.22+mom*.16+rs*.08+struct*.2+pb*.12+body*.12+fvg*.1),sg=Math.sign(score);
  let strat='Stand aside',why='no clean setup yet';
  if(swU||swD){strat='Liquidity Sweep Reversal';why=(swU?'highs':'lows')+' were swept and price closed back inside'}
  else if(Math.abs(fvg)===1&&fvg===sg){strat='Sniper Entry (SMC fair value gap)';why='price pulled back into a fair value gap in the trend direction'}
  else if((up||dn)&&vol>-.1){strat='Breakout Continuation';why='price closed beyond the 20-bar '+(up?'high':'low')+' with volatility holding'}
  else if(body&&body===sg&&S.tf<=7){strat='Candle Body Scalp';why='a strong full-body candle is leading in the trend direction'}
  else if(pb){strat='Trend Pullback';why='trend is '+(pb>0?'up':'down')+' and price is back near the 12 EMA'}
  const conf=Math.round(50+Math.abs(score)*45),side=Math.abs(score)<.22||strat==='Stand aside'?'WAIT':score>0?'BUY':'SELL';
  const pB=Math.max(0,score)+.05,pS=Math.max(0,-score)+.05,pW=1.1-Math.abs(score),sm=pB+pS+pW;
  const slD=Math.max(atr*1.3,(S.ask-S.bid)*3||0),rr=S.tf<=5&&/Scalp|Pullback/.test(strat)?1:1.5;
  S.an={feat:[trend,mom,rs,vol,struct,pb,body,fvg],names:['TREND','MOMENTUM','RSI','VOLATILITY','STRUCTURE','PULLBACK','BODY','FVG/SMC'],out:[pB/sm,pW/sm,pS/sm],score,side,conf,
    strat:(side==='WAIT'&&strat!=='Stand aside'?'Stand aside (watching '+strat+')':strat),why:(side==='WAIT'&&strat!=='Stand aside'?'not strong enough to trade yet: '+why:why),rsi,atr,hi,lo,px,slD,tpD:slD*rr,rr,e12:e12[n],e26:e26[n],e12s:e12,e26s:e26};
  head();megan();maybeTrade(S.an)}
// ---------- Megan's money management + execution (demo first; every guard is on purpose) ----------
function plan(a){const f=S.cur&&S.cur.full;if(!f||!f.lotSize||!S.bal)return null;const step=f.stepVolume||1,minV=f.minVolume||1,sl=a.slD;
  let vol=Math.round(Math.max(.01,parseFloat($('lot').value)||.01)*f.lotSize);vol=Math.max(minV,Math.round(vol/step)*step);
  let risk=sl*vol/100;const cap=S.bal*.015;
  if(risk>cap){vol=Math.floor(cap/(sl/100)/step)*step;if(vol<minV)return{err:'The stop distance of '+fx(sl)+' is too wide for a '+S.bal.toFixed(2)+' balance, so I am skipping this one.'};risk=sl*vol/100}
  return{vol,risk,lots:vol/f.lotSize}}
function openTrade(side,slD,tpD,why){const a=S.an,id=S.cur&&S.cur.symbolId,now=Date.now();if(!id||!a||S.posSyms[id]||now<S.lock||S.ask-S.bid>a.atr*.3)return false;
  const p=plan({slD});if(!p)return false;if(p.err){if(now>S.errAt){S.errAt=now+120000;S.note=p.err;talk(p.err);megan()}return false}
  S.lock=now+60000;S.ph='ACT';
  send(2106,{ctidTraderAccountId:S.acct,symbolId:id,orderType:1,tradeSide:side==='BUY'?1:2,volume:p.vol,relativeStopLoss:Math.round(slD*1e5),relativeTakeProfit:Math.round(tpD*1e5),label:'MQE'});
  S.note='Entered '+side+' ('+(why||a.strat)+'): '+p.lots.toFixed(2)+' lot, stop '+fx(slD)+', target '+fx(tpD)+', risk about '+p.risk.toFixed(2)+'.';talk(S.note);megan();
  setTimeout(()=>send(2124,{ctidTraderAccountId:S.acct}),1500);return true}
function maybeTrade(a){if(S.run&&a.side!=='WAIT'&&a.conf>=65&&Date.now()-S.lastCyc>8000)cycle()}
async function cycle(){const a=S.an;if(!S.run||S.think||!a||!S.cur||!window.Megan)return;S.lastCyc=Date.now();const id=S.cur.symbolId;
  if(S.posSyms[id]||Date.now()<S.lock){S.ph='WATCH';return}
  S.think=true;S.ph='THINK';
  try{const names=a.names,st={symbol:S.cur.symbolName,timeframe:({1:'M1',5:'M5',7:'M15',8:'M30',9:'H1'})[S.tf],price:S.bid||a.px,bid:S.bid,ask:S.ask,spread:S.ask-S.bid,atr:a.atr,
      indicators:{ema12:a.e12,ema26:a.e26,rsi:a.rsi,high20:a.hi,low20:a.lo},signals:Object.fromEntries(names.map((n,i)=>[n,+a.feat[i].toFixed(2)])),
      ruleEngine:{side:a.side,confidence:a.conf,strategy:a.strat,why:a.why},candlesOHLC_last30:S.bars.slice(-30).map(b=>[b.o,b.h,b.l,b.c].map(v=>+v.toFixed(S.digits))),
      news:S.news?S.news.txt:'',newsHeat:S.news?S.news.heat:0,account:{equity:S.bal,dailyLoss:Math.max(0,(S.bal0||S.bal)-S.bal),openRisk:0},
      riskConfig:{maxRiskPercent:1.5,maxDailyLossPercent:3,maxOpenRiskPercent:3,minRewardRisk:1.5},
      instruction:'Real broker data. Decide BUY, SELL or HOLD. Give entry, stopLoss and takeProfit as prices. If a high-impact news event is imminent, HOLD unless post-release momentum confirms. riskPercent must not exceed 1.5.'};
    const d=await Megan.evaluateForex(st);S.brain={...d,at:Date.now()};S.ph='DECIDE';
    if(d.approved&&d.confidence>=65&&d.action!=='HOLD'){
      const buy=d.action==='BUY',en=buy?S.ask:S.bid;let sl=Math.abs(en-d.stopLoss),tp=Math.abs(d.takeProfit-en);
      const okDir=buy?(d.stopLoss<en&&d.takeProfit>en):(d.stopLoss>en&&d.takeProfit<en);
      if(!okDir||!(sl>=a.atr*.6&&sl<=a.atr*4)||!(tp>=sl*1.2)){sl=a.slD;tp=a.slD*1.5}
      openTrade(d.action,sl,tp,d.reason)}
    else{S.note='My brain says HOLD ('+d.confidence+'%): '+d.reason;if(S.lastHold!==d.reason){S.lastHold=d.reason;talk('Holding. '+d.reason)}megan()}
  }catch(e){S.brain=null;S.note='My brain could not be reached: '+e.message}
  finally{S.think=false;if(S.ph!=='ACT')S.ph='WATCH'}}
async function newsTick(){if(!window.Megan||!S.cur)return;
  try{const r=await Megan.research(S.cur.symbolName+' forex market news today economic calendar high impact events central bank inflation',{recencyDays:1,maxSources:5});
    const txt=String(r.answer||r.summary||(r.results||r.sources||[]).slice(0,5).map(x=>(x.title||'')+': '+(x.content||x.snippet||'')).join(' | ')).replace(/\s+/g,' ').slice(0,900);
    const heat=Math.min(1,(txt.match(/\b(CPI|NFP|nonfarm|payrolls|FOMC|Fed|ECB|BoE|BoJ|rate decision|inflation|GDP|tariff|war|crisis|high.impact)\b/gi)||[]).length/6);
    S.news={txt,heat,at:Date.now()};megan()}catch(e){S.news={txt:'',heat:0,at:Date.now()}}}
// keep trades safe once open: breakeven at +1R, then trail
function monitor(){if(!S.run||!S.cur)return;const px=S.bid||S.ask,now=Date.now();if(!px)return;
  S.pl.forEach(q=>{if(q.sym!==S.cur.symbolId||!q.sl)return;const r0=S.r0[q.id]=S.r0[q.id]||Math.abs(q.entry-q.sl);if(!r0||now<(S.amendAt[q.id]||0))return;
    const pr=q.side==='BUY'?px-q.entry:q.entry-px,d=q.side==='BUY'?1:-1;let ns=null;

function drawOrb(ts){const[x,W,H]=fit($('orb'));x.clearRect(0,0,W,H);const a=S.an,cx=W/2,cy=H/2,R=Math.min(W*.2,H*.36);
