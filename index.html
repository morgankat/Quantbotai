<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuantBot — Morgan AI Quant Trading Engine</title>
  <style>
    :root{ --bg:#0b0f14; --panel:#121821; --ink:#e6edf3; --mut:#8b949e; --line:#232b36; --red:#e5484d; --green:#18a058; --blue:#3b6fe0; --purple:#7c5cff; --teal:#0fa3a3; --amber:#e8a13c; --mono:'JetBrains Mono','SF Mono',Consolas,monospace; }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:10px;height:100dvh;overflow:hidden}
    ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#232b36}
    button{font-family:var(--mono);cursor:pointer}

    #app{height:100dvh;display:flex;flex-direction:column;gap:3px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 2px)}
    #topbar{display:flex;align-items:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding:4px 8px;position:static;z-index:50}
    .logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:11px}
    .logo .mark{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,var(--purple),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px}
    .tb-stat{display:flex;flex-direction:column;line-height:1.1}
    .tb-stat .v{font-size:11px;font-weight:700}
    .tb-stat .l{font-size:7px;color:var(--mut)}
    .tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
    .chip{font-size:7px;padding:2px 5px;border-radius:3px;font-weight:700;border:1px solid var(--line)}
    .chip.live{background:#10261c;color:var(--green);border-color:#1d4d35}
    .chip.warn{background:#2a2010;color:var(--amber);border-color:#4d3a1d}
    .clock{font-size:11px;font-weight:700}

    .conn-btn,.engine-btn,.scalp-btn,.cb{border:1px solid var(--line);background:#1b2430;color:var(--ink);padding:4px 6px;border-radius:4px;font-size:7px;font-weight:700}
    .engine-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
    .scalp-btn.on{background:var(--purple);color:#fff;border-color:var(--purple)}

    #ticker{background:#0f141b;color:#cfd0dc;overflow:hidden;white-space:nowrap;padding:2px 0;font-size:7.5px}
    #ticker span{display:inline-block;padding:0 16px}
    .g{color:#7ee2a8}.r{color:#ff8a8a}.b{color:#8fb4ff}.p{color:#c9b8ff}

    #ctlw{padding:0 4px;display:flex;gap:4px;position:relative}
    #ctl{display:flex;gap:3px;align-items:center;width:100%}
    #q{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-family:var(--mono);font-size:9px;background:var(--panel);color:var(--ink)}
    #tfs{display:flex;gap:2px}.tf{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:4px;padding:3px 6px;font-size:8px;font-weight:700}
    .tf.on{background:var(--purple);color:#fff;border-color:var(--purple)}
    #list{position:absolute;left:4px;right:4px;top:100%;z-index:90;background:var(--panel);border:1px solid var(--line);border-radius:5px;max-height:38dvh;overflow:auto;display:none;font-size:9px}
    #list div{padding:6px 8px;border-bottom:1px solid var(--line)}

    #grid2{flex:1 1 0;min-height:0;display:grid;grid-template-columns:58px 1fr 70px;gap:3px;padding:0 4px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px;position:relative;overflow:hidden}
    .ptitle{font-size:6.5px;letter-spacing:1px;color:var(--mut);font-weight:700;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
    
    .stack{display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-height:0;overflow:hidden}
    .mini{flex:1;min-height:0;padding:2px 3px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:3px}
    .mini .h span{font-size:5.6px;color:var(--mut)}.mini .val{font-size:9px;font-weight:800;margin:0}.spark{height:11px;margin-top:1px}

    #orbPanel{min-height:0;padding:3px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
    #orb{flex:1 1 0;width:100%;height:0;min-height:0;display:block}
    .orb-state{font-size:7.5px;font-weight:700;text-align:center;margin-top:2px}
    .orb-sub{font-size:6.4px;color:var(--mut);text-align:center}

    .rpanel{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
    .rcard{flex:1;min-height:0;padding:2px 3px;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:3px}
    .rcard:last-child{flex:2.1}
    .rcard .h{font-size:5.6px;color:var(--mut);font-weight:700;display:flex;justify-content:space-between}
    .cd{font-size:13px;font-weight:800;text-align:center;margin:0}
    .big-prob{font-size:13px;font-weight:800;text-align:center}
    .edge{font-size:6.4px;text-align:center;font-weight:700}
    .stake{font-size:11px;font-weight:800;text-align:center;margin:0}

    .action-row{display:flex;gap:2px;margin-top:2px}
    .action-row button{flex:1;border:1px solid var(--line);background:#1b2430;color:var(--ink);font-size:6.5px;font-weight:700;padding:3px 0;border-radius:3px}
    .action-row button.primary{background:var(--purple);color:#fff;border-color:var(--purple)}

    #candles{width:100%;height:clamp(150px,23dvh,215px);touch-action:none;display:block}

    #tabs{display:flex;gap:2px;padding:0 4px}
    #tabs button{flex:1;font-size:7px;padding:3px 0;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:3px;font-weight:700}
    #tabs button.on{background:var(--purple);color:#fff;border-color:var(--purple)}

    #tabBody{height:clamp(112px,19dvh,150px);padding:0 4px;overflow:hidden}
    #tabBody>.panel{display:none;height:100%;overflow:auto;padding:4px 6px}
    #tabBody>.panel.act{display:block}

    #logs{height:88px;font-size:8px;line-height:1.4}
    .log{display:flex;gap:4px;border-bottom:1px solid #1b2430;padding:1px 0}
    .log .t{color:var(--mut);width:38px}
    .log .tag{width:36px;text-align:center;font-weight:700;border-radius:2px;font-size:6.5px}
    .tag.fill{background:#1b2430;color:var(--blue)}.tag.win{background:#10261c;color:var(--green)}.tag.loss{background:#2a1417;color:var(--red)}
    .log .m{flex:1;color:#c9d1d9}

    #msg{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(11,15,20,.97)}
    #msg button{background:var(--purple);color:#fff;border:none;padding:10px 18px;font-size:11px;border-radius:5px;font-family:var(--mono);font-weight:700}
    
    #btm{position:sticky;bottom:0;background:#0f141b;color:#cfd0dc;font-size:7.5px;padding:2px 0;overflow:hidden;white-space:nowrap}
    #btm span{padding:0 16px}
  </style>
</head>
<body class="dark">

<div id="msg">
  <div style="font-size:14px; font-weight:800; color:var(--ink)">MORGAN AI QUANT ENGINE</div>
  <div style="font-size:9px; color:var(--mut)" id="mt">Connecting to cTrader OpenAPI backend...</div>
  <button id="login">LOGIN WITH CTRADER</button>
</div>

<div id="app">
  <div id="topbar">
    <div class="logo"><div class="mark">Q</div>QuantBot</div>
    <div class="tb-stat"><span class="v" id="tbPrice">—</span><span class="l">PRICE</span></div>
    <div class="tb-stat"><span class="v" id="tbChg" style="color:var(--green)">+0.00%</span><span class="l">BAR</span></div>
    <div class="tb-stat"><span class="v" id="tbProb" style="color:var(--green)">50.0%</span><span class="l">MEGAN P(UP)</span></div>
    <div class="tb-stat"><span class="v" id="tbFlt" style="color:var(--green)">+$0.00</span><span class="l">FLOAT</span></div>
    <div class="clock" id="tbClock">00:00:00</div>
    <div class="tb-right">
      <span class="chip live" id="feedChip">● LIVE</span>
      <span class="chip warn" id="pnlMode">DEMO</span>
      <button class="scalp-btn on" id="scalpBtn">⚡ SCALP</button>
      <button class="engine-btn" id="engineBtn">START MEGAN</button>
      <button class="conn-btn" id="connBtn">CTRADER</button>

  <div id="ticker"><div id="tickerInner"></div></div>

  <div id="ctlw">
    <div id="ctl">
      <input type="text" id="q" placeholder="SEARCH PAIR (XAUUSD, EURUSD...)" autocomplete="off">
      <div id="tfs"></div>
    </div>
    <div id="list"></div>
  </div>

  <div id="grid2">
    <div class="stack" id="sideStack"></div>

    <div class="panel" id="orbPanel">
      <canvas id="orb"></canvas>
      <div class="orb-state" id="orbState">SCANNING MARKET STRUCTURE</div>
      <div class="orb-sub" id="orbSub">20,480 worlds simulated</div>
    </div>

    <div class="rpanel" id="rightRail"></div>
  </div>

  <div class="panel">
    <div class="ptitle"><span>MARKET — LIVE FROM BROKER</span><span id="spotPrice">—</span></div>
    <canvas id="candles"></canvas>
  </div>

  <div id="tabs"></div>

  <div id="tabBody">
    <div class="panel act">
      <div style="font-size:20px; font-weight:800; color:var(--green)" id="pnlBig">$0.00</div>
      <div style="font-size:8px; color:var(--mut); display:flex; gap:6px;">
        OPEN <b id="stOpen" style="color:var(--ink)">0</b> | POS <b id="stPos" style="color:var(--ink)">0</b> | WINS <b id="stWins" style="color:var(--ink)">0</b> | LOSSES <b id="stLoss" style="color:var(--ink)">0</b>
      </div>
      <canvas class="spark" id="eqSpark" style="width:100%; height:26px; margin-top:2px;"></canvas>
    </div>

    <div class="panel">
      <div id="logs"></div>
    </div>

    <div class="panel">
      <div style="font-size:18px; font-weight:800;" id="sigBig">50.0%</div>
      <div style="font-size:8px;" id="sigDelta">+0.0¢</div>
      <div id="sigBars"></div>
    </div>

    <div class="panel">
      <div id="openPos"></div>
    </div>

    <div class="panel">
      <canvas id="modelChart"></canvas>
    </div>

    <div class="panel">
      <canvas id="landing"></canvas>
    </div>
  </div>

  <div id="btm"><div id="btmInner"></div></div>
</div>

<script>
const CID = '40001_PHI0xB6Yq8m5wkmErP66MQwBmizcbSendTkMCWX0Bcfp1LPyS8';
const WORKER = 'https://mute-shadow-9594.katebasadat.workers.dev/';
const LS = localStorage;

const S = { prob:0.5, wins:0, losses:0, bankroll:10000, pnl:0, logs:[], eqCurve:[10000], sig:{}, orbT:0, mktHist:[], probHist:[] };
const X = {
  ws:null, seq:1, tok:LS.mq_tok||'', sec:LS.mq_sec||'', env:LS.mq_env||'demo', acct:+LS.mq_acct||0,
  accs:[], syms:[], cur:null, digits:5, bars:[], bid:0, ask:0, bal:0, bal0:null, open:0,
  run:false, tf:5, lot:parseFloat(LS.mq_lot)||0.01, scalp:true, pl:[], posSyms:{}, lock:0, an:null, sh:[]
};

const TFM = {1:1, 5:5, 7:15, 8:30, 9:60}, TFN = {1:'M1', 5:'M5', 7:'M15', 8:'M30', 9:'H1'};
const $ = id => document.getElementById(id);
const fx = v => (+v).toFixed(X.digits > 5 ? 5 : X.digits);
const cl = (v,a=-1,b=1) => Math.max(a, Math.min(b, v));

function ema(a,n){ const k = 2/(n+1); let e = a[0]; return a.map(v => e = v*k + e*(1-k)); }

function fit(cv){
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  return c;
}

function addLog(tag, msg){
  S.logs.unshift({ t: new Date().toISOString().substr(11,8), tag, msg });
  if(S.logs.length > 50) S.logs.pop();
  if($('logs')) {
    $('logs').innerHTML = S.logs.map(l => `<div class="log"><span class="t">${l.t}</span><span class="tag ${l.tag}">${l.tag.toUpperCase()}</span><span class="m">${l.msg}</span></div>`).join('');
  }
}

const redirect = () => location.origin + location.pathname.replace(/\/index\.html$/, '');
const send = (t,p) => { if(X.ws && X.ws.readyState === 1) X.ws.send(JSON.stringify({clientMsgId:'m'+X.seq++, payloadType:t, payload:p})); };

$('login').onclick = () => {
  location.href = 'https://id.ctrader.com/my/settings/openapi/grantingaccess/?client_id=' + encodeURIComponent(CID) + '&redirect_uri=' + encodeURIComponent(redirect()) + '&scope=trading&product=web';
};

async function boot(){
  const code = new URLSearchParams(location.search).get('code');
  if(code){
    history.replaceState({}, '', location.pathname);
    $('mt').textContent = 'Exchanging Authorization Code...';
    try{
      const d = await(await fetch(WORKER+'?code='+encodeURIComponent(code)+'&redirect_uri='+encodeURIComponent(redirect()))).json();
      if(d.accessToken){
        X.tok = d.accessToken; X.sec = d.clientSecret || X.sec;
        LS.mq_tok = X.tok; LS.mq_sec = X.sec;
      }
    }catch(e){
      $('mt').textContent = 'Auth Helper Error: ' + e.message;
      return;
    }
  }
  
  // Auto-connect if credentials exist
  if(X.tok){
    connect();
  } else {
    $('mt').textContent = 'cTrader Authorization Required';
    $('msg').style.display = 'flex';
  }
}

function connect(){
  $('mt').textContent = 'Connecting WebSockets...';
  $('msg').style.display = 'flex';
  const ws = X.ws = new WebSocket('wss://' + X.env + '.ctraderapi.com:5036');
  
  ws.onopen = () => {
    send(2100, {clientId: CID, clientSecret: X.sec || CID});
    X.hb = setInterval(() => send(51, {}), 20000);
  };
  
  ws.onmessage = e => {
    try {
      const m = JSON.parse(e.data);
      handle(m.payloadType, m.payload || {});
    } catch (_) {}
  };
  
  ws.onclose = () => {
    clearInterval(X.hb);
    setTimeout(connect, 3000);
  };
}

function handle(t,p){
  if(t === 2101){
    send(2149, {accessToken: X.tok});
  }
  else if(t === 2150){
    X.accs = (p.ctidTraderAccount||[]).filter(a => !a.isLive === (X.env === 'live'));
    if(X.accs.length) pickAcct(X.accs[0].ctidTraderAccountId);
  }
  else if(t === 2103){
    $('msg').style.display = 'none'; // Unblock overlay on successful auth
    $('connBtn').textContent = 'ACCT ' + X.acct;
    refresh(); send(2114, {ctidTraderAccountId: X.acct});
    addLog('sys', 'CTRADER ONLINE — ACCOUNT ' + X.acct);
  }
  else if(t === 2122 && p.trader){
    X.bal = p.trader.balance / Math.pow(10, p.trader.moneyDigits||2);
    if(X.bal0 === null) X.bal0 = X.bal;
    S.bankroll = X.bal;
  }
  else if(t === 2125){
    const l = p.position || [];
    X.open = l.length; X.posSyms = {};
    l.forEach(q => { if(q.tradeData) X.posSyms[q.tradeData.symbolId] = q.tradeData.tradeSide; });
  }
  else if(t === 2115){
    X.syms = (p.symbol||[]).filter(s => s.symbolName);
    const d = X.syms.find(s => /^XAUUSD/.test(s.symbolName)) || X.syms[0];
    if(d) choose(d);
  }
  else if(t === 2138) bars(p);
  else if(t === 2131 && X.cur && p.symbolId === X.cur.symbolId) tick(p);
}

function pickAcct(a){ X.acct = a; LS.mq_acct = a; send(2102, {ctidTraderAccountId: a, accessToken: X.tok}); }
function refresh(){ send(2121, {ctidTraderAccountId: X.acct}); send(2124, {ctidTraderAccountId: X.acct}); }

function choose(s){
  X.cur = s; X.bars = []; X.an = null;
  send(2116, {ctidTraderAccountId: X.acct, symbolId: [s.symbolId]});
  send(2127, {ctidTraderAccountId: X.acct, symbolId: [s.symbolId]});
  getBars();
  addLog('fill', 'WATCHING ' + s.symbolName);
}

function getBars(){
  const id = X.cur.symbolId, n = Date.now();
  send(2137, {ctidTraderAccountId: X.acct, symbolId: id, period: X.tf, fromTimestamp: n - 300 * TFM[X.tf] * 6e4, toTimestamp: n});
}

function bars(p){
  const k = 1e5;
  X.bars = (p.trendbar||[]).map(b => ({
    t: b.utcTimestampInMinutes, o: (b.low + b.deltaOpen)/k, c: (b.low + b.deltaClose)/k,
    h: (b.low + b.deltaHigh)/k, l: b.low/k
  })).sort((a,b) => a.t - b.t);
  analyze();
}

function tick(p){
  const k = 1e5;
  if(p.bid) X.bid = p.bid/k;
  if(p.ask) X.ask = p.ask/k;
  const px = X.bid || X.ask;
  if(!px || !X.bars.length) return;
  const m = Math.floor(Date.now()/60000), bt = m - m % TFM[X.tf], L = X.bars[X.bars.length-1];
  if(bt > L.t) X.bars.push({t:bt, o:px, h:px, l:px, c:px});
  else { L.c = px; L.h = Math.max(L.h, px); L.l = Math.min(L.l, px); }
  analyze();
}

$('q').oninput = () => {
  const v = $('q').value.trim().toUpperCase(), l = $('list');
  if(!v){ l.style.display = 'none'; return; }
  const r = X.syms.filter(s => s.symbolName.toUpperCase().includes(v)).slice(0, 10);
  l.innerHTML = r.length ? '' : '<div style="padding:6px;color:var(--mut)">No pairs found</div>';
  r.forEach(s => {
    const d = document.createElement('div');
    d.textContent = s.symbolName;
    d.onclick = () => { choose(s); l.style.display = 'none'; $('q').value = ''; };
    l.appendChild(d);
  });
  l.style.display = 'block';
};

/* INSTITUTIONAL CONFLUENCE ENGINE */
function analyze(){
  const B = X.bars;
  if(B.length < 40) return;
  const c = B.map(x => x.c), n = c.length - 1, e12 = ema(c, 12), e26 = ema(c, 26);
  
  let g = 0, ls = 0;
  for(let i = n-13; i <= n; i++){ const d = c[i] - c[i-1]; d > 0 ? g += d : ls -= d; }
  const rsi = ls ? 100 - 100/(1 + g/ls) : 100;
  
  const trf = a => a.map((x,i,r) => i ? Math.max(x.h - x.l, Math.abs(x.h - r[i-1].c), Math.abs(x.l - r[i-1].c)) : x.h - x.l).slice(1);
  const avg = a => a.reduce((p,q) => p + q, 0)/a.length;
  const atr = avg(trf(B.slice(-14))) || 1e-9;
  
  const recent = B.slice(-25, -1);
  const swingHi = Math.max(...recent.map(x => x.h));
  const swingLo = Math.min(...recent.map(x => x.l));
  const L = B[n], P = B[n-1], px = c[n];
  
  const trend = cl((e12[n] - e26[n]) / atr / 1.5);
  const mom = cl((px - c[n-5]) / atr / 2.5);
  
  const bosUp = L.c > swingHi && P.c <= swingHi && mom > 0.15;
  const bosDn = L.c < swingLo && P.c >= swingLo && mom < -0.15;
  const struct = bosUp ? 1 : bosDn ? -1 : (px > swingHi ? 0.5 : px < swingLo ? -0.5 : 0);
  
  let score = cl(trend * 0.35 + mom * 0.30 + struct * 0.35);
  let side = Math.abs(score) < 0.40 ? 'WAIT' : score > 0 ? 'BUY' : 'SELL';
  
  // Absolute counter-trend blocks
  if (side === 'BUY' && (rsi < 35 || trend < -0.35)) side = 'WAIT';
  if (side === 'SELL' && (rsi > 65 || trend > 0.35)) side = 'WAIT';
  
  const sp = (X.ask - X.bid) || 0;
  const slD = Math.min(Math.max(atr * 0.75, sp * 2), 1.80);
  const tpD = slD * 2.2;
  
  X.an = { score, side, rsi, atr, slD, tpD };
  S.prob = cl(0.5 + score * 0.45, 0.05, 0.95);
  
  if($('bigProb')) $('bigProb').textContent = (S.prob * 100).toFixed(0) + '%';
  if($('edgeVal')) $('edgeVal').textContent = side;
  
  maybeTrade();
}

function plan(){
  const f = X.cur && X.cur.full;
  if(!f || !f.lotSize || !X.an) return null;
  const step = f.stepVolume || 1, minV = f.minVolume || 1, sl = X.an.slD;
  
  let maxRiskAmt = Math.max(4, S.bankroll * 0.01);
  let calculatedLot = (maxRiskAmt / (sl * (f.lotSize / 100))) || X.lot;
  let finalLot = Math.min(X.lot, calculatedLot);
  
  let vol = Math.round(Math.max(0.01, finalLot) * f.lotSize);
  vol = Math.max(minV, Math.round(vol / step) * step);
  return { vol, lots: vol / f.lotSize };
}

function maybeTrade(){
  if(!X.run || !X.an || X.an.side === 'WAIT' || Date.now() < X.lock) return;
  const id = X.cur.symbolId;
  if(X.posSyms[id]) return;
  
  const p = plan();
  if(!p) return;
  
  X.lock = Date.now() + 12000;
  const side = X.an.side === 'BUY' ? 1 : 2;
  const q5 = Math.pow(10, 5 - Math.min(5, X.digits || 5));
  const rel = v => Math.max(q5, Math.round(v * 1e5 / q5) * q5);
  
  send(2106, {
    ctidTraderAccountId: X.acct, symbolId: id, orderType: 1, tradeSide: side,
    volume: p.vol, relativeStopLoss: rel(X.an.slD), relativeTakeProfit: rel(X.an.tpD), label: 'MEGAN_FIXED'
  });
  
  addLog('bet', 'EXECUTED ' + X.an.side + ' ON ' + X.cur.symbolName);
}

function drawOrbCore(){
  const cv = $('orb'); if(!cv) return;
  const c = fit(cv), w = cw(cv), h = chh(cv);
  c.clearRect(0,0,w,h);
  const cx = w/2, cy = h/2, R = Math.min(w,h) * 0.35;
  S.orbT += 0.015;
  
  c.strokeStyle = 'rgba(124,92,255,.3)'; c.lineWidth = 0.8;
  for(let k=0; k<8; k++){
    c.beginPath();
    for(let a=0; a<=Math.PI*2+0.1; a+=0.25){
      const rr = R * 1.1 + Math.sin(a*3 + S.orbT*2 + k) * 5;
      const x = cx + Math.cos(a) * rr * 1.2, y = cy + Math.sin(a) * rr * 0.5;
      a === 0 ? c.moveTo(x,y) : c.lineTo(x,y);
    }
    c.stroke();
  }
}

function drawCandles(){
  const cv = $('candles'); if(!cv) return;
  const c = fit(cv), w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w; cv.height = h;
  c.clearRect(0, 0, w, h);
  const B = X.bars.slice(-45);
  if(B.length < 5) return;
  
  const hi = Math.max(...B.map(b => b.h)), lo = Math.min(...B.map(b => b.l));
  const Y = v => h - 10 - ((v - lo) / (hi - lo || 1)) * (h - 20);
  const bw = w / B.length;
  
  B.forEach((b, i) => {
    const up = b.c >= b.o, x = i * bw + bw / 2;
    c.strokeStyle = c.fillStyle = up ? '#18a058' : '#e5484d';
    c.beginPath(); c.moveTo(x, Y(b.h)); c.lineTo(x, Y(b.l)); c.stroke();
    c.fillRect(x - bw * 0.3, Math.min(Y(b.o), Y(b.c)), bw * 0.6, Math.max(1, Math.abs(Y(b.o) - Y(b.c))));
  });
}

function frame(){
  drawCandles(); drawOrbCore();
  requestAnimationFrame(frame);
}

$('engineBtn').onclick = () => {
  X.run = !X.run;
  $('engineBtn').textContent = X.run ? 'STOP MEGAN' : 'START MEGAN';
  $('engineBtn').classList.toggle('on', X.run);
};

$('scalpBtn').onclick = () => {
  X.scalp = !X.scalp;
  $('scalpBtn').classList.toggle('on', X.scalp);
};

buildTicker = () => {
  const spans = ['QUANT ENGINE ONLINE', 'CTRADER WEBSOCKET CONNECTED', 'MEGAN BRAIN SYNCED'].map(m => `<span class="g">${m}</span>`).join('');
  $('tickerInner').innerHTML = spans + spans;
  $('btmInner').innerHTML = spans + spans;
  $('tickerInner').style.animation = 'marq 40s linear infinite';
  $('btmInner').style.animation = 'marq 40s linear infinite';
};

buildTicker();
boot();
requestAnimationFrame(frame);
</script>
